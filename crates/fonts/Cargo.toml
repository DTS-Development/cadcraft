[package]
name = "cadcraft-fonts"
description = "CADCraft text: the built-in single-stroke drafting font and TEXT/MTEXT layout"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# The PPM build: the web build embeds every font of CRAFT_FONTS_DIR, not only the few of the upstream web build.
ppm-host = []

[dependencies]
cadcraft-geom = { workspace = true }
craft-dxf = { workspace = true }
craft-font-catalog = { workspace = true }
craft-shx = { workspace = true }
skrifa = { workspace = true }
harfrust = { workspace = true }
unicode-bidi = { workspace = true }
icu_segmenter = { workspace = true }
encoding_rs = { workspace = true }
